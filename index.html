<style>
/* Layout: one phone column, sticky top bar, fixed bottom tab bar; dark gym look (single theme by choice) */
:root{
  --bg:#111418; --surface:#1C2027; --surface2:#272C35; --line:#2E343E;
  --fg:#F1F2F4; --muted:#A3A9B3; --accent:#F2A93B; --accent-ink:#111418;
  --blue:#5B9BF0; --blue-ink:#0B1220; --good:#4CC38A; --good-ink:#0B1A12;
  --super:#8B74E8; --warn-bg:#2A2216; --warn-fg:#F2C77A; --good-bg:#17271D; --info-bg:#1A2433;
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:14px}
h1{font-size:24px;font-weight:800;margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.warn{background:var(--warn-bg);border:1px solid var(--accent)}
.card.info{background:var(--info-bg)}
.card.good{background:var(--good-bg)}
.card.hl{outline:2px solid var(--accent)}
.card.ss{border-right:4px solid var(--super)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font-family:var(--font);font-size:15px;border:0;border-radius:12px;min-height:44px;padding:0 14px;background:var(--surface2);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn-p{background:var(--accent);color:var(--accent-ink);font-weight:800}
.btn-g{background:var(--good);color:var(--good-ink);font-weight:800}
.btn-b{background:var(--blue);color:var(--blue-ink);font-weight:700}
.btn-ghost{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.btn-w{width:100%}
.btn-big{min-height:54px;font-size:17px}
.tile{flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;padding:14px;min-height:96px;border-radius:16px;background:var(--surface)}
.tile b{font-size:16px}.tile span{font-size:13px;color:var(--muted);font-weight:400}
.chip{min-height:38px;border-radius:19px;padding:0 13px;font-size:14px;background:var(--surface)}
.chip.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.seg button{min-height:40px;background:transparent;color:var(--muted);font-size:14px;border-radius:9px}
.seg button.on{background:var(--surface2);color:var(--fg);font-weight:700}
.seg.acc button.on{background:var(--accent);color:var(--accent-ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
input,textarea,select{font-family:var(--font);font-size:16px;background:var(--surface2);color:var(--fg);border:0;border-radius:10px;min-height:44px;padding:0 10px;width:100%;min-width:0}
input.num{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
textarea{padding:10px;resize:vertical;min-height:70px;line-height:1.6}
textarea.code{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:200px}
.tag{font-size:12px;font-weight:800;border-radius:12px;padding:2px 9px;background:var(--super);color:#fff;white-space:nowrap}
.muted{color:var(--muted)}.good{color:var(--good)}.acc{color:var(--accent)}.warnc{color:var(--warn-fg)}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.tn{font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr)) 48px;gap:6px;align-items:center}
.setrow.head{font-size:11px;color:var(--muted)}
.setrow.done input{background:#243A2B}
.ckb{width:44px;height:44px;min-height:44px;padding:0;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:18px}
.ckb.on{background:var(--good);color:var(--good-ink);border-color:var(--good)}
.ssrow{display:grid;grid-template-columns:34px minmax(0,1fr) 64px 58px;gap:6px;align-items:center;font-size:13px}
.list-item{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.strike{text-decoration:line-through;color:#8A919C}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#171A20;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{background:transparent;color:var(--muted);font-size:13px;min-height:52px;flex-direction:column;gap:2px;padding:0}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.timer{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:30;max-width:536px;margin:0 auto;
  background:#22262E;border:1px solid var(--accent);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.timer .t{font-size:28px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:var(--good);color:var(--good-ink);font-weight:700;border-radius:12px;padding:8px 16px;font-size:14px}
.chart{width:100%;height:auto;display:block;direction:ltr}
.photo{aspect-ratio:3/4;max-width:100%;width:100%;border-radius:12px;background:var(--surface2);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{min-width:44px;padding:0 8px}
pre.out{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--font);font-size:13px;line-height:1.7;margin:0;max-height:360px;overflow:auto;color:#D3D7DD}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
"use strict";
/* ---------- utils ---------- */
const FA="۰۱۲۳۴۵۶۷۸۹";
const fa=v=>String(v==null?"":v).replace(/\d/g,d=>FA[d]).replace(/\./g,"٫");
const faT=v=>String(v==null?"":v).replace(/\d/g,d=>FA[d]);
const num=v=>{if(v==null||v==="")return null;const s=String(v).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,،]/g,".").replace(/[^\d.\-]/g,"");if(s===""||s==="."||s==="-")return null;const n=parseFloat(s);return isNaN(n)?null:n};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diffDays=(a,b)=>Math.round((fromKey(b)-fromKey(a))/864e5);
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const toHM=s=>{if(!s)return null;const t=String(s).replace(/[۰-۹]/g,d=>FA.indexOf(d)).match(/(\d{1,2})\D?(\d{2})?/);if(!t)return null;return pad(Math.min(23,+t[1]))+":"+pad(Math.min(59,+(t[2]||0)))};
const addMin=(hm,m)=>{const [h,mi]=hm.split(":").map(Number);let t=(h*60+mi+m)%1440;if(t<0)t+=1440;return pad(Math.floor(t/60))+":"+pad(t%60)};
const hmToMin=hm=>{const [h,m]=hm.split(":").map(Number);return h*60+m};
const uid=()=>Math.random().toString(36).slice(2,9);

/* Jalali (jalaali-js algorithm) */
const dv=(a,b)=>~~(a/b),md=(a,b)=>a-~~(a/b)*b;
function jalCal(jy){const br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];let gy=jy+621,leapJ=-14,jp=br[0],jm,jump,leap,n,i;
for(i=1;i<br.length;i++){jm=br[i];jump=jm-jp;if(jy<jm)break;leapJ+=dv(jump,33)*8+dv(md(jump,33),4);jp=jm}
n=jy-jp;leapJ+=dv(n,33)*8+dv(md(n,33)+3,4);if(md(jump,33)===4&&jump-n===4)leapJ+=1;
const leapG=dv(gy,4)-dv((dv(gy,100)+1)*3,4)-150,march=20+leapJ-leapG;if(jump-n<6)n=n-jump+dv(jump+4,33)*33;leap=md(md(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function g2d(gy,gm,gd){let d=dv((gy+dv(gm-8,6)+100100)*1461,4)+dv(153*md(gm+9,12)+2,5)+gd-34840408;return d-dv(dv(gy+100100+dv(gm-8,6),100)*3,4)+752}
function d2g(jdn){let j=4*jdn+139361631;j=j+dv(dv(4*jdn+183187720,146097)*3,4)*4-3908;const i=dv(md(j,1461),4)*5+308,gd=dv(md(i,153),5)+1,gm=md(dv(i,153),12)+1,gy=dv(j,1461)-100100+dv(8-gm,6);return{gy,gm,gd}}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy),f=g2d(gy,3,r.march);let k=jdn-f,jm,jd;
if(k>=0){if(k<=185){jm=1+dv(k,31);jd=md(k,31)+1;return{jy,jm,jd}}k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}
jm=7+dv(k,30);jd=md(k,30)+1;return{jy,jm,jd}}
const MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const WD=["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
const WDS=["ی","د","س","چ","پ","ج","ش"];
function jal(k){const d=fromKey(k);return d2j(g2d(d.getFullYear(),d.getMonth()+1,d.getDate()))}
const jShort=k=>{const j=jal(k);return faT(j.jd)+" "+MONTHS[j.jm-1]};
const jLong=k=>{const j=jal(k);return WD[fromKey(k).getDay()]+" "+faT(j.jd)+" "+MONTHS[j.jm-1]+" "+faT(j.jy)};
const jNum=k=>{const j=jal(k);return j.jy+"/"+pad(j.jm)+"/"+pad(j.jd)};

/* ---------- state ---------- */
const LS="ali_gym_v1";
const SAMPLE_PROGRAM={sample:true,sessions:[
 {name:"سینه و بازو",ex:[{name:"پرس سینه هالتر",sets:4,reps:"8-10",rest:120},{name:"پرس بالاسینه دمبل",sets:3,reps:"10-12",rest:90},{name:"قفسه سیم‌کش",sets:3,reps:"12-15",rest:75},{name:"جلوبازو هالتر",sets:3,reps:"10-12",rest:90,group:"A"},{name:"جلوبازو چکشی",sets:3,reps:"10-12",rest:90,group:"A"},{name:"پشت‌بازو سیم‌کش",sets:3,reps:"12-15",rest:75}]},
 {name:"زیربغل و سرشانه",ex:[{name:"بارفیکس یا زیربغل سیم‌کش",sets:4,reps:"8-10",rest:120},{name:"زیربغل تی‌بار",sets:3,reps:"10-12",rest:90},{name:"پرس سرشانه دمبل",sets:3,reps:"8-10",rest:120},{name:"نشر جانب",sets:3,reps:"12-15",rest:60}]},
 {name:"پا",ex:[{name:"اسکوات هالتر",sets:4,reps:"6-8",rest:150},{name:"ددلیفت رومانیایی",sets:3,reps:"8-10",rest:120},{name:"پرس پا",sets:3,reps:"10-12",rest:90},{name:"ساق پا ایستاده",sets:3,reps:"12-15",rest:60}]},
 {name:"بالاتنه‌ی ترکیبی",ex:[{name:"پرس سینه دمبل",sets:3,reps:"8-10",rest:120},{name:"زیربغل قایقی",sets:3,reps:"10-12",rest:90},{name:"پرس سرشانه هالتر",sets:3,reps:"8-10",rest:120},{name:"جلوبازو دمبل",sets:3,reps:"10-12",rest:75}]}
]};
function fresh(){return{v:1,days:{},program:SAMPLE_PROGRAM,diet:null,settings:{gymTime:"18:00",nextIdx:0,lastSent:null,lastMeasure:null}}}
let S;
try{S=JSON.parse(localStorage.getItem(LS)||"null")}catch(e){S=null}
if(!S||!S.v)S=fresh();
S.settings=Object.assign({gymTime:"18:00",nextIdx:0,lastSent:null,lastMeasure:null},S.settings||{});
let dirtyDays=new Set(),dirtyMeta=false;
function day(k){k=k||todayKey();if(!S.days[k])S.days[k]={date:k,u:0};return S.days[k]}
function touch(k){const d=day(k);d.u=Date.now();dirtyDays.add(k);save()}
function touchMeta(){S.settings.u=Date.now();dirtyMeta=true;save()}
let saveT=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(sync,1500)}
const hasData=d=>d&&Object.keys(d).some(k=>k!=="date"&&k!=="u");

/* ---------- cloud backup (db) ---------- */
let DB=null,cloud="off";
async function initCloud(){
  if(!window.claude){cloud="off";return}
  try{DB=await window.claude.use("db")}catch(e){DB=null}
  if(!DB){cloud="off";return}
  cloud="sync";
  try{
    const meta=await DB.doc("meta/main").get();
    if(meta.exists){const m=meta.data();const lu=(S.settings&&S.settings.u)||0;
      if((m.settings&&m.settings.u||0)>lu){S.program=m.program||S.program;S.diet=m.diet||null;S.settings=Object.assign(S.settings,m.settings||{})}else dirtyMeta=true}
    else dirtyMeta=true;
    const snap=await DB.collection("days").limit(1000).get();
    const seen=new Set();
    snap.docs.forEach(doc=>{const r=doc.data();if(!r||!r.date)return;seen.add(r.date);const l=S.days[r.date];
      if(!l||(r.u||0)>(l.u||0))S.days[r.date]=JSON.parse(JSON.stringify(r));else if((l.u||0)>(r.u||0))dirtyDays.add(r.date)});
    Object.keys(S.days).forEach(k=>{if(!seen.has(k)&&hasData(S.days[k]))dirtyDays.add(k)});
    try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
    cloud="ok";render();sync();
  }catch(e){cloud="err"}
}
let syncing=false;
async function sync(){
  if(!DB||syncing)return;syncing=true;
  try{
    if(dirtyMeta){dirtyMeta=false;await DB.doc("meta/main").set({program:S.program,diet:S.diet,settings:S.settings})}
    const ks=[...dirtyDays];dirtyDays.clear();
    for(const k of ks){const d=S.days[k];if(d&&hasData(d))await DB.doc("days/"+k).set(JSON.parse(JSON.stringify(d)))}
    cloud="ok";
  }catch(e){cloud="err";}
  syncing=false;
}

/* ---------- photos (IndexedDB, phone only) ---------- */
let idb=null;
function openIDB(){return new Promise(res=>{try{const r=indexedDB.open("ali_gym_photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null)}catch(e){res(null)}})}
function idbGet(key){return new Promise(res=>{if(!idb)return res(null);try{const q=idb.transaction("p").objectStore("p").get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function idbPut(key,val){return new Promise(res=>{if(!idb)return res(false);try{const t=idb.transaction("p","readwrite");t.objectStore("p").put(val,key);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
function compress(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.8))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

/* ---------- ui state ---------- */
const UI={view:"home",tab:"home",date:todayKey(),progEx:null,progMode:"kg",bodyTab:"scale",importText:"",importPreview:null,importErr:"",manualIdx:0,editEx:null,out:"",outTitle:"",cardioMode:"pre"};
function go(v,extra){Object.assign(UI,extra||{});UI.view=v;const map={home:"home",program:"program",import:"program",manual:"program",warmup:"home",workout:"home",progress:"progress",food:"food",supps:"food",more:"more",band:"more",body:"more",summary:"more",settings:"more"};UI.tab=map[v]||"more";render();window.scrollTo(0,0)}
function toast(t){const s=document.getElementById("toastSlot");s.innerHTML='<div class="toast" role="status">'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>s.innerHTML="",1800)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("کپی شد");return true}catch(e){UI.out=t;UI.outTitle="کپی خودکار نشد — متن رو نگه‌دار و کپی کن";render();setTimeout(()=>{const p=document.getElementById("outBox");if(p){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}},50);return false}}

/* ---------- program helpers ---------- */
const sessions=()=>(S.program&&S.program.sessions)||[];
function lastLogOf(name,beforeKey){const ks=Object.keys(S.days).sort().reverse();for(const k of ks){if(beforeKey&&k>=beforeKey)continue;const w=S.days[k].workout;if(!w||!w.ex)continue;const e=w.ex.find(x=>x.name===name&&x.sets.some(s=>s.done));if(e)return{k,e}}return null}
function groups(ex){const out=[];ex.forEach((e,i)=>{const g=e.group;const last=out[out.length-1];if(g&&last&&last.g===g)last.items.push(i);else out.push({g:g||null,items:[i]})});return out}
function startWorkout(idx){const s=sessions()[idx];if(!s)return;const k=todayKey();const d=day(k);
  if(d.workout&&d.workout.ex&&d.workout.ex.some(e=>e.sets.some(x=>x.done))&&!d.workout.ended){go("workout");return}
  d.workout={idx,name:s.name,start:nowHM(),ended:null,warm:null,cardio:null,ex:s.ex.map(e=>{const last=lastLogOf(e.name,k);const n=Math.max(1,+e.sets||3);return{name:e.name,group:e.group||null,reps:e.reps||"",rest:+e.rest||90,note:"",sets:Array.from({length:n},(_,i)=>{const ls=last&&last.e.sets[i];return{kg:ls&&ls.kg!=null?ls.kg:null,reps:null,rpe:null,done:false,hint:ls?ls:null}})}})};
  d.dayType=d.dayType||null;touch(k);go("warmup")}

let TM=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.25,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+t+0.3);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.3)})}catch(e){}}
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function startTimer(sec){unlockAudio();TM={end:Date.now()+sec*1000,total:sec,done:false};tick();clearInterval(startTimer.i);startTimer.i=setInterval(tick,250)}
function stopTimer(){TM=null;clearInterval(startTimer.i);document.getElementById("timerSlot").innerHTML=""}
function tick(){const slot=document.getElementById("timerSlot");if(!TM){slot.innerHTML="";return}
  const left=Math.max(0,Math.round((TM.end-Date.now())/1000));
  if(left===0&&!TM.done){TM.done=true;beep();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}
  const m=Math.floor(left/60),s=left%60;const t=faT(m+":"+pad(s));
  if(slot.dataset.v===String(left)+TM.done)return;slot.dataset.v=String(left)+TM.done;
  slot.innerHTML='<div class="timer" role="timer" aria-label="تایمر استراحت"><div class="col" style="gap:0;flex:1"><span class="sub">'+(TM.done?'وقت ست بعدیه':'استراحت')+'</span><span class="t">'+t+'</span></div>'+
  '<button data-a="tAdd">+۳۰ث</button><button data-a="tStop">'+(TM.done?'بستن':'رد کن')+'</button></div>'}

/* ---------- import parsing ---------- */
const FORMAT_GUIDE=`راهنمای فرمت «اپ باشگاه علی» — برای هر هوش مصنوعی
برنامه رو دقیقاً با این فرمت بنویس: خط اول ALI-GYM-PROGRAM v1 و بعدش یک JSON معتبر.

۱) برنامه‌ی تمرین (جلسه‌های نوبتی، به ترتیب):
ALI-GYM-PROGRAM v1
{"type":"workout","sessions":[
 {"name":"سینه و بازو","ex":[
  {"name":"پرس سینه هالتر","sets":4,"reps":"8-10","rest":120},
  {"name":"جلوبازو هالتر","sets":3,"reps":"10-12","rest":90,"group":"A"},
  {"name":"جلوبازو چکشی","sets":3,"reps":"10-12","rest":90,"group":"A"}
 ]}
]}
- rest به ثانیه است. حرکت‌هایی که پشت‌سرهم با یک group یکسان بیان، سوپرست حساب می‌شن.

۲) برنامه‌ی غذایی و مکمل:
ALI-GYM-PROGRAM v1
{"type":"diet",
 "gym":{"targets":{"kcal":2400,"protein":190,"carbs":230,"fat":70},
  "meals":[{"name":"صبحانه","time":"08:00","items":"۳ تخم‌مرغ، نان، پنیر"},
           {"name":"قبل از باشگاه","rel":-60,"items":"۱ موز"},
           {"name":"بعد از باشگاه","rel":30,"items":"۱۵۰ گرم مرغ، برنج"}]},
 "rest":{"targets":{"kcal":2100,"protein":190,"carbs":150,"fat":75},"meals":[...]},
 "supplements":[{"name":"کراتین","dose":"۵ گرم","rel":0,"days":"all","time":"10:00"},
                {"name":"لوسین","dose":"۵ گرم","rel":-30,"days":"gym"}]}
- time ساعت ثابت است. rel دقیقه نسبت به تمرین است: منفی یعنی قبل از شروع، مثبت یعنی بعد از پایان (تمرین حدود ۶۰ دقیقه فرض می‌شه).
- days یکی از gym ، rest یا all است. در روز استراحت اگر rel داده شده باشه از time استفاده می‌شه.
وزن‌ها به کیلوگرم و تاریخ‌ها شمسی. فقط کد رو بده، بدون توضیح اضافه.`;
function parseImport(txt){
  const t=String(txt||"").trim();if(!t)throw new Error("متنی پیست نشده");
  const i=t.indexOf("{");const j=t.lastIndexOf("}");if(i<0||j<i)throw new Error("کد JSON پیدا نشد. اول متن باید ALI-GYM-PROGRAM v1 باشه و بعدش {…}");
  let o;try{o=JSON.parse(t.slice(i,j+1).replace(/[“”]/g,'"'))}catch(e){throw new Error("کد ناقص یا خرابه: "+e.message)}
  if(o.type==="workout"||(o.sessions&&!o.type)){
    if(!Array.isArray(o.sessions)||!o.sessions.length)throw new Error("هیچ جلسه‌ای تو کد نیست");
    const ses=o.sessions.map((s,si)=>{if(!s||!Array.isArray(s.ex))throw new Error("جلسه‌ی "+faT(si+1)+" لیست حرکت (ex) نداره");return{name:String(s.name||("جلسه "+(si+1))),ex:s.ex.map(e=>({name:String(e.name||"حرکت"),sets:Math.max(1,Math.min(10,num(e.sets)||3)),reps:String(e.reps||""),rest:Math.max(15,Math.min(600,num(e.rest)||90)),group:e.group?String(e.group):null}))}});
    return{type:"workout",data:{sessions:ses}}}
  if(o.type==="diet"){
    const fix=p=>p?{targets:p.targets||{},meals:(p.meals||[]).map(m=>({id:"m"+uid(),name:String(m.name||"وعده"),time:m.time?toHM(m.time):null,rel:m.rel!=null?num(m.rel):null,items:String(m.items||"")}))}:{targets:{},meals:[]};
    return{type:"diet",data:{gym:fix(o.gym),rest:fix(o.rest),supplements:(o.supplements||[]).map(s=>({name:String(s.name||"مکمل"),dose:String(s.dose||""),time:s.time?toHM(s.time):null,rel:s.rel!=null?num(s.rel):null,days:["gym","rest","all"].includes(s.days)?s.days:"all"}))}}}
  throw new Error("نوع برنامه مشخص نیست (type باید workout یا diet باشه)");
}

function dayText(k){const d=S.days[k];if(!d||!hasData(d))return null;const L=[];

    if(w.warm)L.push("گرم کردن تردمیل: "+fa(w.warm.min||"?")+" دقیقه، سرعت "+fa(w.warm.speed||"?")+"، شیب "+fa(w.warm.inc||"?")+"٪"+(w.warm.hr?"، ضربان "+fa(w.warm.hr):"")+(w.warm.kcal?"، "+fa(w.warm.kcal)+" کالری":""));
    w.ex.forEach(e=>{const ss=e.sets.filter(s=>s.done||s.kg!=null&&s.reps!=null);if(!ss.length)return;L.push("- "+e.name+(e.group?" [سوپرست "+e.group+"]":"")+": "+ss.map(s=>fa(s.kg==null?"-":s.kg)+"×"+fa(s.reps==null?"-":s.reps)+(s.rpe?" (سختی "+fa(s.rpe)+")":"")).join(" · ")+(e.note?" — یادداشت: "+e.note:""))});
    if(w.cardio)L.push("کاردیو بعد از تمرین: "+fa(w.cardio.min||"?")+" دقیقه، سرعت "+fa(w.cardio.speed||"?")+"، شیب "+fa(w.cardio.inc||"?")+"٪");}
  const f=d.food;const plan=S.diet&&S.diet[dayType(k)];
  if(f||plan){const parts=[];(plan&&plan.meals||[]).forEach(m=>{const st=f&&f.meals&&f.meals[m.id];if(!st)parts.push(m.name+": ثبت نشده");else if(st.s==="ate")parts.push(m.name+": طبق برنامه ✓");else parts.push(m.name+": به‌جاش "+(st.alt||"؟"))});
    (f&&f.extra||[]).forEach(x=>parts.push("اضافه"+(x.t?" ("+faT(x.t)+")":"")+": "+x.text));
    if(parts.length)L.push("تغذیه: "+parts.join(" | "));
    if(f&&f.water)L.push("آب: "+faT(f.water)+" لیوان");
    const sup=(S.diet&&S.diet.supplements||[]).filter(s=>s.days==="all"||s.days===dayType(k));if(sup.length)L.push("مکمل: "+sup.map(s=>s.name+(f&&f.supps&&f.supps[s.name]?" ✓":" ✗")).join("، "));
    if(f&&f.note)L.push("یادداشت غذا: "+f.note);}
  const sl=d.sleep;if(sl&&(sl.bed||sl.wake))L.push("خواب: "+faT(sl.bed||"?")+" تا "+faT(sl.wake||"?")+(sleepH(sl)?" ("+fa(sleepH(sl))+" ساعت)":"")+(sl.q?" · کیفیت "+faT(sl.q)+" از ۵":""));
  if(d.steps||d.rhr)L.push("دستبند: "+(d.steps?"قدم "+fa(d.steps):"")+(d.rhr?" · ضربان استراحت "+fa(d.rhr):""));
  (d.walks||[]).forEach(x=>L.push("پیاده‌روی: "+fa(x.min||"?")+" دقیقه، "+fa(x.km||"?")+" کیلومتر"+(x.hr?"، میانگین ضربان "+fa(x.hr):"")));
  const b=d.body;if(b&&(b.weight||b.fat))L.push("ترازو: وزن "+fa(b.weight||"?")+" کیلو، چربی "+fa(b.fat||"?")+"٪"+(b.muscle?"، عضله "+fa(b.muscle):"")+(b.water?"، آب بدن "+fa(b.water)+"٪":""));
  if(d.meas){const m=Object.entries(d.meas).filter(([,v])=>v!=null);if(m.length)L.push("اندازه‌ها (سانت): "+m.map(([kk,v])=>MEAS_L[kk]+" "+fa(v)).join("، "))}
  if(d.photos&&Object.values(d.photos).some(Boolean))L.push("عکس پیشرفت گرفته شد ("+Object.keys(d.photos).filter(x=>d.photos[x]).map(x=>POSE_L[x]).join("، ")+")");
  if(d.note)L.push("یادداشت روز: "+d.note);
  return L.join("\n")}
function rangeText(a,b){const out=[];for(let k=a;k<=b;k=addDays(k,1)){const t=dayText(k);if(t)out.push(t)}
  return "خلاصه‌ی «اپ باشگاه علی» — "+jShort(a)+(a!==b?" تا "+jShort(b):"")+"\nواحدها: وزنه کیلوگرم، اندازه سانتی‌متر، سختی ست ۱ تا ۱۰ (۱۰ = تا ناتوانی)\n\n"+(out.length?out.join("\n\n"):"برای این بازه چیزی ثبت نشده.")}
function sleepH(sl){if(!sl||!sl.bed||!sl.wake)return null;let a=hmToMin(sl.bed),b=hmToMin(sl.wake);let m=b-a;if(m<=0)m+=1440;return Math.round(m/6)/10}

V.progress=()=>{const names=[];const seen=new Set();sessions().forEach(s=>s.ex.forEach(e=>{if(!seen.has(e.name)){seen.add(e.name);names.push(e.name)}}));
  Object.keys(S.days).sort().forEach(k=>{const w=S.days[k].workout;w&&w.ex.forEach(e=>{if(!seen.has(e.name)){seen.add(e.name);names.push(e.name)}})});
  if(!UI.progEx||!seen.has(UI.progEx))UI.progEx=names[0];const nm=UI.progEx;
  const pts=[];Object.keys(S.days).sort().forEach(k=>{const w=S.days[k].workout;if(!w)return;w.ex.filter(e=>e.name===nm).forEach(e=>{const ok=e.sets.filter(s=>s.done&&s.kg!=null&&s.reps!=null);if(!ok.length)return;
    const top=ok.reduce((a,b)=>b.kg>a.kg||(b.kg===a.kg&&b.reps>a.reps)?b:a);const vol=ok.reduce((a,b)=>a+b.kg*b.reps,0);pts.push({k,top,vol,ss:!!e.group,sets:ok})})});
  let h='<h1>پیشرفت</h1><label class="f">حرکت<select data-a="progSel" id="progSel">'+names.map(n=>'<option '+(n===nm?"selected":"")+'>'+esc(n)+'</option>').join("")+'</select></label>';
  if(!pts.length)return h+'<div class="card"><b>هنوز برای «'+esc(nm||"")+'» ستی ثبت نشده</b><span class="sub">بعد از اولین تمرین، نمودار وزنه و حجم اینجا ساخته می‌شه.</span></div>';
  const vals=pts.map(p=>UI.progMode==="kg"?p.top.kg:p.vol);
  h+='<div class="card"><div class="row"><b>'+(UI.progMode==="kg"?"سنگین‌ترین ست هر جلسه (کیلو)":"حجم کل جلسه (کیلو × تکرار)")+'</b><span class="sub">'+faT(pts.length)+' جلسه</span></div>'+chart(vals,pts.map(p=>jShort(p.k)),pts.map(p=>p.ss))+
   '<div class="seg"><button class="'+(UI.progMode==="kg"?"on":"")+'" data-a="pm" data-x="kg">وزنه</button><button class="'+(UI.progMode==="vol"?"on":"")+'" data-a="pm" data-x="vol">حجم</button></div>'+
   (pts.some(p=>p.ss)?'<span class="sub"><span style="color:var(--super)">●</span> جلسه‌هایی که سوپرست زدی</span>':'')+'</div>';
  const best=pts.reduce((a,b)=>b.top.kg>a.top.kg?b:a);const e1=Math.max(...pts.map(p=>p.top.kg*(1+p.top.reps/30)));const gain=pts[pts.length-1].top.kg-pts[0].top.kg;
  h+='<div class="grid3"><div class="card" style="gap:2px;padding:12px"><span class="sub">رکورد</span><b class="big" style="font-size:20px">'+fa(best.top.kg)+'</b><span class="sub">کیلو × '+fa(best.top.reps)+'</span></div>'+
   '<div class="card" style="gap:2px;padding:12px"><span class="sub">رشد</span><b class="big '+(gain>=0?"good":"warnc")+'" style="font-size:20px">'+(gain>0?"+":"")+fa(Math.round(gain*10)/10)+'</b><span class="sub">کیلو از اول</span></div>'+
   '<div class="card" style="gap:2px;padding:12px"><span class="sub">۱RM تخمینی</span><b class="big" style="font-size:20px">'+fa(Math.round(e1*2)/2)+'</b><span class="sub">کیلو</span></div></div>';
  h+='<h2>تاریخچه</h2>'+pts.slice().reverse().slice(0,12).map(p=>'<div class="list-item"><span>'+jShort(p.k)+(p.ss?' <span class="tag">سوپرست</span>':'')+'</span><span class="sub tn">'+p.sets.map(s=>fa(s.kg)+"×"+fa(s.reps)).join(" · ")+'</span></div>').join("");

function chart(vals,labels,marks,unit){const W=340,H=170,L=34,R=10,T=12,B=26;if(!vals.length)return"";
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1}const pd=(mx-mn)*0.12;mn-=pd;mx+=pd;
  const x=i=>vals.length===1?(L+W-R)/2:L+i*(W-L-R)/(vals.length-1),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const ticks=[mn+(mx-mn)*0.15,mn+(mx-mn)*0.5,mn+(mx-mn)*0.85];
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="نمودار">';
  ticks.forEach(t=>{const yy=y(t);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2A2F38"/><text x="'+(L-4)+'" y="'+(yy+4)+'" fill="#A3A9B3" font-size="10" text-anchor="end" font-family="Vazirmatn,Tahoma">'+fa(Math.round(t*10)/10)+'</text>'});
  const path=vals.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  if(vals.length>1)s+='<polygon points="'+x(0)+','+(H-B)+' '+path+' '+x(vals.length-1)+','+(H-B)+'" fill="rgba(242,169,59,.12)"/><polyline points="'+path+'" fill="none" stroke="#F2A93B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  vals.forEach((v,i)=>{s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+(i===vals.length-1?5:3.5)+'" fill="'+(marks&&marks[i]?"#8B74E8":"#F2A93B")+'" stroke="#111418" stroke-width="1.5"/>'});
  s+='<text x="'+x(0)+'" y="'+(H-8)+'" fill="#A3A9B3" font-size="10" text-anchor="start" font-family="Vazirmatn,Tahoma">'+esc(labels[0])+'</text>';
  if(vals.length>1)s+='<text x="'+x(vals.length-1)+'" y="'+(H-8)+'" fill="#A3A9B3" font-size="10" text-anchor="end" font-family="Vazirmatn,Tahoma">'+esc(labels[labels.length-1])+'</text>';
  return s+'</svg>'}

V.settings=()=>back("more")+'<h1>تنظیمات و پشتیبان</h1>'+
  '<div class="card"><b>ذخیره‌ی اطلاعات</b><span class="sub">'+(cloud==="ok"?"روی گوشی ذخیره می‌شه و یه نسخه‌ی پشتیبان هم خودکار روی Claude نگه‌داری می‌شه.":cloud==="err"?"روی گوشی ذخیره شد. پشتیبان ابری الان در دسترس نیست و بعداً خودش دوباره تلاش می‌کنه.":"روی همین گوشی ذخیره می‌شه (نسخه‌ی مستقل، بدون Claude). هر چند وقت یه بار «ذخیره‌ی فایل پشتیبان» رو بزن تا اطلاعاتت امن بمونه.")+'</span><span class="sub">بدون اینترنت هم ثبت کن؛ هر وقت وصل شدی، پشتیبان به‌روز می‌شه. عکس‌ها فقط روی گوشی می‌مونن.</span></div>'+
  '<div class="card"><label class="f" style="flex-direction:row;align-items:center;justify-content:space-between">ساعت معمول باشگاه<input class="num" style="width:110px" data-f="s.gymTime" data-t="hm" value="'+faT(S.settings.gymTime)+'"></label></div>'+
  '<div class="card"><b>نسخه‌ی پشتیبان دستی</b><span class="sub">یه فایل از همه‌ی اطلاعات (غیر از عکس‌ها). اگه گوشی عوض شد، با «بازگردانی» برش گردون.</span><div class="grid2"><button class="btn-b" data-a="backup">ذخیره‌ی فایل پشتیبان</button><label class="btn" for="restoreFile" style="cursor:pointer">بازگردانی از فایل</label></div><input type="file" id="restoreFile" accept=".json,application/json,text/plain" data-a="restore" hidden></div>'+
  '<div class="card"><b>یادآوری‌ها</b><span class="sub">یادآوری «روز اندازه و عکس» و «خلاصه نفرستادی» تو صفحه‌ی خانه نشون داده می‌شه. نوتیفیکیشن ساعت‌دار رو Claude می‌تونه تو تقویم گوشیت بذاره.</span></div>'+out();

/* ---------- render ---------- */
function render(){const app=document.getElementById("app");const fn=V[UI.view]||V.home;app.innerHTML=fn();renderTabs();if(UI.view!=="workout")releaseWake()}

/* ---------- field binding ---------- */
function resolve(path){const seg=path.split(".");const r=seg.shift();let obj;
  if(r==="d")obj=day(UI.view==="workout"||UI.view==="warmup"?todayKey():UI.date);
  else if(r==="w")obj=day(todayKey()).workout;
  else if(r==="s")obj=S.settings;
  else if(r==="p")obj=sessions();
  return{obj,seg,root:r}}
function setPath(path,val){const {obj,seg,root}=resolve(path);let o=obj;for(let i=0;i<seg.length-1;i++){const s=seg[i];if(o[s]==null)o[s]=/^\d+$/.test(seg[i+1])?[]:{};o=o[s]}o[seg[seg.length-1]]=val;
  if(root==="p"||root==="s"){if(root==="p"&&S.program)S.program.sample=false;touchMeta()}else touch(root==="w"?todayKey():(UI.view==="workout"||UI.view==="warmup"?todayKey():UI.date))}
const NUMERIC=/\.(kg|reps|rpe|min|speed|inc|hr|kcal|steps|rhr|km|weight|fat|muscle|water|sets|rest)$|^d\.(steps|rhr)$|^d\.meas\./;
document.addEventListener("change",e=>{const el=e.target;const p=el.dataset&&el.dataset.f;if(!p)return;let v=el.value;
  if(el.dataset.t==="hm")v=toHM(v);else if(/^p\..*\.reps$/.test(p))v=String(v).replace(/[۰-۹]/g,d=>FA.indexOf(d)).trim();else if(NUMERIC.test(p))v=num(v);else v=v.trim();
  setPath(p,v);if(el.dataset.r)render()});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="impText")UI.importText=el.value});

/* ---------- actions ---------- */
const A={
 tab:x=>go(x),go:(x,y)=>{if(x==="body"&&y)UI.bodyTab=y;if(["food","band","body","supps"].includes(x)&&!["food","band","body","supps"].includes(UI.view))UI.date=todayKey();if(x==="warmup")UI.cardioMode="pre";go(x)},
 start:x=>{unlockAudio();startWorkout(+x)},
 warmDone:()=>{UI.cardioMode="pre";go("workout")},warmSkip:()=>{const w=day(todayKey()).workout;if(w){w.warm=null;touch(todayKey())}go("workout")},
 cardio:()=>{UI.cardioMode="post";UI.view="warmup";render();scrollTo(0,0)},
 setDone:(x,y)=>{const k=todayKey(),w=day(k).workout,e=w.ex[+x],s=e.sets[+y];s.done=!s.done;if(s.done){if(s.kg==null&&s.hint&&s.hint.kg!=null)s.kg=s.hint.kg;startTimer(e.rest)}touch(k);render()},
 roundDone:(x,y)=>{const k=todayKey(),w=day(k).workout;const ids=x.split(",").map(Number);const r=+y;const was=ids.every(i=>!w.ex[i].sets[r]||w.ex[i].sets[r].done);
   ids.forEach(i=>{const s=w.ex[i].sets[r];if(s){s.done=!was;if(s.done&&s.kg==null&&s.hint&&s.hint.kg!=null)s.kg=s.hint.kg}});if(!was)startTimer(Math.max(...ids.map(i=>w.ex[i].rest)));touch(k);render()},
 addSet:x=>{const k=todayKey(),e=day(k).workout.ex[+x];const l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:null,reps:null,rpe:null,done:false,hint:null});touch(k);render()},
 addRound:x=>{const k=todayKey(),w=day(k).workout;x.split(",").map(Number).forEach(i=>{const l=w.ex[i].sets[w.ex[i].sets.length-1];w.ex[i].sets.push({kg:l?l.kg:null,reps:null,rpe:null,done:false,hint:null})});touch(k);render()},
 timer:x=>startTimer(+x),tAdd:()=>{if(TM){TM.end+=30000;TM.done=false;tick()}},tStop:()=>stopTimer(),
 finish:()=>finishWorkout(),
 setNext:x=>{S.settings.nextIdx=+x;touchMeta();render()},
 impCheck:()=>{const t=document.getElementById("impText");UI.importText=t?t.value:UI.importText;UI.importErr="";UI.importPreview=null;try{UI.importPreview=parseImport(UI.importText)}catch(e){UI.importErr=e.message}render()},
 impApply:()=>{const p=UI.importPreview;if(!p)return;if(p.type==="workout"){S.program={sample:false,sessions:p.data.sessions};S.settings.nextIdx=0}else S.diet=p.data;touchMeta();UI.importPreview=null;UI.importText="";toast(p.type==="workout"?"برنامه‌ی تمرین عوض شد":"برنامه‌ی غذایی عوض شد");go(p.type==="workout"?"program":"food")},
 impCancel:()=>{UI.importPreview=null;render()},
 copyGuide:()=>copyText(FORMAT_GUIDE),
 mSel:x=>{UI.manualIdx=+x;UI.editEx=null;render()},
 mAddSes:()=>{S.program.sessions.push({name:"جلسه‌ی جدید",ex:[]});S.program.sample=false;UI.manualIdx=S.program.sessions.length-1;UI.editEx=null;touchMeta();render()},
 mDelSes:()=>{if(UI.confirmDel!==UI.manualIdx){UI.confirmDel=UI.manualIdx;toast("برای حذف دوباره بزن");return}S.program.sessions.splice(UI.manualIdx,1);UI.manualIdx=0;UI.confirmDel=null;S.settings.nextIdx=0;touchMeta();render()},
 mAddEx:()=>{const s=sessions()[UI.manualIdx];if(!s)return;s.ex.push({name:"",sets:3,reps:"10-12",rest:90,group:null});S.program.sample=false;UI.editEx=s.ex.length-1;touchMeta();render()},
 mEdit:x=>{UI.editEx=+x;render()},mDone:()=>{const s=sessions()[UI.manualIdx];if(s&&UI.editEx!=null&&!s.ex[UI.editEx].name)s.ex[UI.editEx].name="حرکت";UI.editEx=null;touchMeta();render()},
 mDel:x=>{const s=sessions()[UI.manualIdx];s.ex.splice(+x,1);UI.editEx=null;touchMeta();render()},
 mUp:x=>{const s=sessions()[UI.manualIdx],i=+x;if(i<1)return;[s.ex[i-1],s.ex[i]]=[s.ex[i],s.ex[i-1]];touchMeta();render()},
 mSS:x=>{const s=sessions()[UI.manualIdx],i=+x,e=s.ex[i],pv=s.ex[i-1];const on=document.getElementById("ssck"+i).checked;
   if(on){pv.group=pv.group||String.fromCharCode(65+new Set(s.ex.map(z=>z.group).filter(Boolean)).size);e.group=pv.group}else{e.group=null;if(!s.ex.some((z,j)=>j!==i-1&&z.group===pv.group))pv.group=null}touchMeta();render()},
 pm:x=>{UI.progMode=x;render()},
 dprev:()=>{UI.date=addDays(UI.date,-1);render()},dnext:()=>{if(UI.date<todayKey())UI.date=addDays(UI.date,1);render()},
 dtype:x=>{const d=day(UI.date);d.dayType=x;touch(UI.date);render()},
 meal:(x,y)=>{const d=day(UI.date);d.food=d.food||{};d.food.meals=d.food.meals||{};const cur=d.food.meals[x];if(cur&&cur.s===y)delete d.food.meals[x];else d.food.meals[x]={s:y,alt:cur&&cur.alt||""};touch(UI.date);render()},
 addExtra:()=>{const t=document.getElementById("extraTxt");const v=t&&t.value.trim();if(!v)return;const d=day(UI.date);d.food=d.food||{};d.food.extra=d.food.extra||[];d.food.extra.push({t:UI.date===todayKey()?nowHM():null,text:v});touch(UI.date);render()},
 delExtra:x=>{const d=day(UI.date);d.food.extra.splice(+x,1);touch(UI.date);render()},
 water:x=>{const d=day(UI.date);d.food=d.food||{};d.food.water=Math.max(0,(d.food.water||0)+(+x));touch(UI.date);render()},
 supp:x=>{const d=day(UI.date);d.food=d.food||{};d.food.supps=d.food.supps||{};d.food.supps[x]=!d.food.supps[x];touch(UI.date);render()},
 sq:x=>{const d=day(UI.date);d.sleep=d.sleep||{};d.sleep.q=+x;touch(UI.date);render()},
 addWalk:()=>{const d=day(UI.date);d.walks=d.walks||[];d.walks.push({min:null,km:null,hr:null});touch(UI.date);render()},
 btab:x=>{UI.bodyTab=x;render()},
 measDone:()=>{S.settings.lastMeasure=UI.date;touchMeta();touch(UI.date);toast("اندازه‌ها ثبت شد");render()},
 copyRange:x=>{UI.pendingSent=todayKey();copyText(rangeText(x,todayKey()))},
 sent:()=>{S.settings.lastSent=todayKey();touchMeta();toast("ثبت شد: تا امروز فرستاده شد");render()},
 copyFull:()=>copyText(fullExport()),
 csv:()=>saveFile("ali-gym-data-"+todayKey()+".csv",csvExport(),"text/csv"),
 backup:()=>saveFile("ali-gym-backup-"+todayKey()+".json",JSON.stringify(S),"application/json"),
 outClose:()=>{UI.out="";render()}
};
async function saveFile(name,text,type){const blob=new Blob(["﻿"+text],{type:type+";charset=utf-8"});
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;if(dl){await dl.save({filename:name,data:blob});toast("فایل آماده شد");return}}catch(e){}
  if(!window.claude){try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("فایل ذخیره شد");return}catch(e){}}
  UI.out=text;UI.outTitle="ذخیره‌ی فایل اینجا ممکن نشد — متن رو کپی کن";render()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;if(a==="photo"||a==="restore"||a==="progSel")return;if(b.tagName==="INPUT"&&b.type==="checkbox"){A[a]&&A[a](b.dataset.x,b.dataset.y);return}e.preventDefault();A[a]&&A[a](b.dataset.x,b.dataset.y)});
document.addEventListener("change",async e=>{const el=e.target;const a=el.dataset&&el.dataset.a;
  if(a==="progSel"){UI.progEx=el.value;render()}
  if(a==="photo"&&el.files&&el.files[0]){const u=await compress(el.files[0]);if(!u){toast("عکس خونده نشد");return}await (idb||openIDB());const ok=await idbPut(UI.date+"_"+el.dataset.x,u);if(ok){const d=day(UI.date);d.photos=d.photos||{};d.photos[el.dataset.x]=true;touch(UI.date);toast("عکس ذخیره شد")}else toast("ذخیره‌ی عکس روی این گوشی ممکن نشد");render()}
  if(a==="restore"&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result.replace(/^﻿/,""));if(!o||!o.days)throw 0;S=o;S.settings=Object.assign(fresh().settings,S.settings||{});touchMeta();Object.keys(S.days).forEach(k=>{S.days[k].u=Date.now();dirtyDays.add(k)});save();toast("اطلاعات برگشت");go("home")}catch(err){toast("این فایل پشتیبان اپ نیست")}};fr.readAsText(el.files[0])}});
document.addEventListener("paste",e=>{if(UI.view==="import"&&e.target.id!=="impText"){const t=e.clipboardData&&e.clipboardData.getData("text");if(t){UI.importText=t;A.impCheck()}}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(UI.view==="workout")keepAwake();if(TM)tick()}else sync()});

render();openIDB();
setTimeout(initCloud,0);
})();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
